name: Deploy NameGen

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - data/**
      - public/**
      - tests/**
      - Dockerfile
      - k8s/namegen-deployment.yaml
      - logger.js
      - package.json
      - package-lock.json
      - server.js
  workflow_dispatch:

concurrency:
  group: namegen-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:3.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run application and automation tests
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/namegen
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/namegen-pycache
        run: |
          set -Eeuo pipefail
          node --check server.js
          node --check data/connection.js
          npm test
          python3 -m py_compile scripts/launch.py scripts/terminate.py
          python3 -m unittest discover -s tests -p 'test_*.py'

  deploy:
    name: Build and deploy immutable image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      KUBERNETES_NAMESPACE: namegen

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable deployment metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA must be a full 40-character Git SHA." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Deployments are restricted to the main branch." >&2
            exit 1
          fi

          for variable_name in \
            AWS_ACCOUNT_ID \
            AWS_REGION \
            AWS_ROLE_ARN \
            ECR_REPOSITORY \
            EKS_CLUSTER_NAME; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing repository variable: ${variable_name}" >&2
              exit 1
            fi
          done

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_ID must contain exactly 12 digits." >&2
            exit 1
          fi

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 1800
          role-session-name: namegen-${{ github.run_id }}-${{ github.run_attempt }}
          retry-max-attempts: 3
          action-timeout-s: 60

      - name: Resolve immutable ECR image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          result_file="$RUNNER_TEMP/namegen-ecr-image.json"
          error_file="$RUNNER_TEMP/namegen-ecr-image.err"

          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"

          set +e
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --output json \
            --no-cli-pager \
            > "$result_file" \
            2> "$error_file"
          describe_status=$?
          set -e

          if [[ $describe_status -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'ImageNotFoundException' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit "$describe_status"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build, verify and push the image
        if: steps.image.outputs.exists == 'false'
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -Eeuo pipefail

          local_image="namegen:${GITHUB_SHA}"

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --load \
            --tag "$local_image" \
            .

          architecture="$(docker image inspect \
            --format '{{.Architecture}}' \
            "$local_image")"
          configured_user="$(docker image inspect \
            --format '{{.Config.User}}' \
            "$local_image")"
          runtime_identity="$(docker run \
            --rm \
            --platform linux/amd64 \
            "$local_image" \
            sh -c 'printf "%s:%s:%s" "$(id -u)" "$(id -g)" "$(id -un)"')"

          [[ "$architecture" == "amd64" ]]
          [[ "$configured_user" == "node" ]]
          [[ "$runtime_identity" == "1000:1000:node" ]]

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            --no-cli-pager |
          docker login \
            --username AWS \
            --password-stdin \
            "$REGISTRY"

          docker tag "$local_image" "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Verify the ECR digest
        id: digest
        shell: bash
        run: |
          set -Eeuo pipefail

          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager)"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR did not return a valid image digest." >&2
            exit 1
          fi

          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl 1.35
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.0

      - name: Configure EKS access
        run: |
          set -Eeuo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias "$EKS_CLUSTER_NAME" \
            --no-cli-pager

      - name: Deploy the reviewed application manifest
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail

          manifest="k8s/namegen-deployment.yaml"
          rendered_manifest="$RUNNER_TEMP/namegen-deployment.yaml"

          if [[ "$(grep -c 'image: namegen-image:git-sha' "$manifest")" -ne 1 ]]; then
            echo "Expected exactly one immutable image placeholder." >&2
            exit 1
          fi

          sed \
            "s|image: namegen-image:git-sha|image: ${IMAGE_URI}|" \
            "$manifest" \
            > "$rendered_manifest"

          if grep -Eq 'kind: Secret|image: .*:latest|namegen-image:git-sha' \
            "$rendered_manifest"; then
            echo "Rendered Deployment failed the security audit." >&2
            exit 1
          fi

          kubectl apply --filename "$rendered_manifest"
          kubectl --namespace "$KUBERNETES_NAMESPACE" \
            rollout status deployment/namegen \
            --timeout=15m

      - name: Validate the deployed runtime
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail

          deployed_image="$(kubectl --namespace "$KUBERNETES_NAMESPACE" \
            get deployment namegen \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          desired_replicas="$(kubectl --namespace "$KUBERNETES_NAMESPACE" \
            get deployment namegen \
            -o jsonpath='{.spec.replicas}')"
          ready_replicas="$(kubectl --namespace "$KUBERNETES_NAMESPACE" \
            get deployment namegen \
            -o jsonpath='{.status.readyReplicas}')"
          mongodb_ready="$(kubectl --namespace "$KUBERNETES_NAMESPACE" \
            get statefulset mongodb \
            -o jsonpath='{.status.readyReplicas}')"
          nlb_hostname="$(kubectl --namespace "$KUBERNETES_NAMESPACE" \
            get service namegen \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

          [[ "$deployed_image" == "$IMAGE_URI" ]]
          [[ "$desired_replicas" == "2" ]]
          [[ "$ready_replicas" == "2" ]]
          [[ "$mongodb_ready" == "1" ]]
          [[ "$nlb_hostname" =~ ^[A-Za-z0-9.-]+\.elb\.${AWS_REGION}\.amazonaws\.com$ ]]

          connection_file="$RUNNER_TEMP/namegen-connection.json"
          ready=false

          for attempt in $(seq 1 40); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://${nlb_hostname}/api/connection" \
              > "$connection_file" &&
              jq -e '
                .connectionInfo == {
                  "host": "mongodb",
                  "port": 27017,
                  "name": "namegen"
                }
              ' "$connection_file" >/dev/null; then
              ready=true
              break
            fi

            echo "Waiting for the public NameGen endpoint (${attempt}/40)..."
            sleep 15
          done

          if [[ "$ready" != "true" ]]; then
            echo "The public NameGen endpoint did not become ready." >&2
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "http://${nlb_hostname}/" |
          grep -F 'Random Name Generator and Saver' \
            >/dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "http://${nlb_hostname}/api/random_name" |
          jq -e '.firstName and .lastName' \
            >/dev/null

          {
            echo '## NameGen deployment'
            echo
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- ECR repository: \`${ECR_REPOSITORY}\`"
            echo "- Image digest: \`${{ steps.digest.outputs.value }}\`"
            echo "- EKS cluster: \`${EKS_CLUSTER_NAME}\`"
            echo '- NameGen replicas: `2/2 Ready`'
            echo '- MongoDB replicas: `1/1 Ready`'
            echo '- Public smoke test: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"
