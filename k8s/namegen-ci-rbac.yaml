apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namegen-github-deployer
  namespace: namegen
  labels:
    app.kubernetes.io/name: namegen-github-deployer
    app.kubernetes.io/part-of: namegen
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - namegen
    verbs:
      - get
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    resourceNames:
      - mongodb
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - namegen
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namegen-github-deployer
  namespace: namegen
  labels:
    app.kubernetes.io/name: namegen-github-deployer
    app.kubernetes.io/part-of: namegen
subjects:
  - kind: Group
    name: namegen-github-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namegen-github-deployer
